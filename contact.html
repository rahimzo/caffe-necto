<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caffè Necto | Contact</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
</head>
<body class="font-poppins bg-cream-50 text-coffee-900">
    <custom-navbar></custom-navbar>
    <div class="pt-20"></div> <!-- Add padding to account for fixed navbar -->
    
    <!-- Contact Header -->
<section class="relative py-32 flex items-center justify-center bg-gradient-to-br from-coffee-800 to-coffee-600 overflow-hidden">
        <div class="absolute inset-0 bg-black/30 z-10"></div>
        <img src="http://static.photos/food/1200x630/46" alt="Café Interior" class="absolute w-full h-full object-cover">
        <div class="container mx-auto px-6 z-20 text-center text-cream-50">
            <h1 class="text-4xl md:text-6xl font-bold mb-4">Contact Us</h1>
            <p class="text-xl md:text-2xl">We'd love to hear from you</p>
        </div>
    </section>

    <!-- Contact Content -->
    <section class="py-20">
        <div class="container mx-auto px-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                <!-- Contact Form -->
                <div class="bg-white rounded-xl shadow-lg p-8">
                    <h2 class="text-2xl font-bold mb-6">Send Us a Message</h2>
                    <form class="space-y-6">
                        <div>
                            <label for="name" class="block text-sm font-medium text-coffee-700 mb-1">Name</label>
                            <input type="text" id="name" class="w-full px-4 py-2 border border-cream-300 rounded-lg focus:ring-gold-500 focus:border-gold-500" placeholder="Your name">
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-coffee-700 mb-1">Email</label>
                            <input type="email" id="email" class="w-full px-4 py-2 border border-cream-300 rounded-lg focus:ring-gold-500 focus:border-gold-500" placeholder="your@email.com">
                        </div>
                        <div>
                            <label for="message" class="block text-sm font-medium text-coffee-700 mb-1">Message</label>
                            <textarea id="message" rows="4" class="w-full px-4 py-2 border border-cream-300 rounded-lg focus:ring-gold-500 focus:border-gold-500" placeholder="Your message"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-gold-500 hover:bg-gold-600 text-coffee-900 font-medium py-3 px-6 rounded-full transition-all duration-300">
                            Send Message
                        </button>
                    </form>
                </div>

                <!-- Contact Info -->
                <div>
                    <h2 class="text-2xl font-bold mb-6">Visit Us</h2>
                    <div class="space-y-6">
                        <div class="flex items-start">
                            <i data-feather="map-pin" class="w-5 h-5 mt-1 mr-4 stroke-gold-500"></i>
                            <div>
                                <h3 class="font-semibold text-lg">Address</h3>
                                <p class="text-coffee-600">123 Coffee Lane, Beanville, BV 12345</p>
                            </div>
                        </div>
                        <div class="flex items-start">
                            <i data-feather="phone" class="w-5 h-5 mt-1 mr-4 stroke-gold-500"></i>
                            <div>
                                <h3 class="font-semibold text-lg">Phone</h3>
                                <p class="text-coffee-600">(555) 123-4567</p>
                            </div>
                        </div>
                        <div class="flex items-start">
                            <i data-feather="mail" class="w-5 h-5 mt-1 mr-4 stroke-gold-500"></i>
                            <div>
                                <h3 class="font-semibold text-lg">Email</h3>
                                <p class="text-coffee-600">hello@caffenecto.com</p>
                            </div>
                        </div>
                        <div class="flex items-start">
                            <i data-feather="clock" class="w-5 h-5 mt-1 mr-4 stroke-gold-500"></i>
                            <div>
                                <h3 class="font-semibold text-lg">Hours</h3>
                                <ul class="text-coffee-600 space-y-1">
                                    <li>Monday - Friday: 7am - 7pm</li>
                                    <li>Saturday - Sunday: 8am - 6pm</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Map -->
                    <div class="mt-8 rounded-xl overflow-hidden shadow-lg">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3022.2155738132036!2d-73.98811742468407!3d40.7484404713893!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c259a9b3117469%3A0xd134e199a405a163!2sEmpire%20State%20Building!5e0!3m2!1sen!2sus!4v1711238083515!5m2!1sen!2sus" 
                        width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <custom-footer></custom-footer>

    <script>
        feather.replace();
    </script>
  <script src="components/footer.js"></script>
</body>
</html>
